[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "itemid"
version = "0.1.0"
description = "Fine-grained item identification with calibrated confidence, abstention, active learning and CI quality gates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=1.0",
  "numpy>=1.24",
  "pillow>=10",
  "pydantic>=2.5",
  "pyyaml>=6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "prometheus-client>=0.20"]
export = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
itemid = "itemid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File(...) default is the framework idiom
